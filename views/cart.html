<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart &mdash; Mr. Beans Coffee</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header>
  <div class="logo">
    <img src="/images/logo.jpg" alt="Mr. Beans Coffee" class="logo-img">
    <span>Mr. Beans Coffee</span>
  </div>
  <nav>
    <a href="/">Home</a>
    <a href="/shop">Shop</a>
    <a href="/contact">Contact</a>
  </nav>
  <div class="cart-icon">&#128722; <span class="cart-count">0</span></div>
</header>

<main class="auth-page">
  <section class="auth-card" style="max-width:600px;">
    <h1>Your Cart</h1>
    <div id="cart-items"></div>
    <a href="/checkout" class="btn-primary" style="margin-top:20px;display:inline-block;text-align:center;">Proceed to Checkout &rarr;</a>
  </section>
</main>

<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
